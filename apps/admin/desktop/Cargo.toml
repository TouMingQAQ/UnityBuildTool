[package]
name = "unitybuildtool-admin"
version = "0.1.0"
description = "UnityBuildTool 管理端"
authors = ["UnityBuildTool"]
edition = "2021"

[build-dependencies]
winresource = "0.1"

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["accesskit", "clipboard", "default_fonts", "system_fonts", "wgpu"] }
tray-icon = "0.27"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
open = "5"
tiny_http = "0.12"
tempfile = "3"
sha2 = "0.10"
regex = "1"
chrono = { version = "0.4", features = ["clock"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
libc = "0.2"
sysinfo = "0.33"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_UI_WindowsAndMessaging"] }
