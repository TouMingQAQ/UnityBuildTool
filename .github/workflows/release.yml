name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/admin/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci --prefix apps/admin

      - name: Check frontend syntax
        run: npm run check

      - name: Run Rust tests
        run: npm test

      - name: Build Tauri application
        run: npm run build:admin

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: UnityBuildTool-windows
          path: apps/admin/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Publish release assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            apps/admin/src-tauri/target/release/bundle/nsis/*.exe
            apps/admin/src-tauri/target/release/bundle/msi/*.msi
